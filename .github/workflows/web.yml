
name: SpendSense Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UV_PYTHON: "3.12"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build website
        shell: bash
        run: |
          uv run flet build web --yes --base-url "${GITHUB_REPOSITORY#*/}" --route-url-strategy hash
          
      - name: Add receipt scanner
        run: cp receipt-scanner.html build/web/receipt-scanner.html
        
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
